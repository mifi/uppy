name: Deploy uppy.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'packages/@uppy/**'
      - 'packages/uppy/**'
      - 'yarn.lock'
      - '.github/workflows/deploy-website.yml'

env:
  YARN_ENABLE_GLOBAL_CACHE: false

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    if: github.repository == 'transloadit/uppy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - run: corepack yarn install --immutable
      - run: corepack yarn build
      - run: corepack yarn workspace uppy-io build

      - name: Restore IndexNow production state
        if:
          github.repository == 'transloadit/uppy' && github.ref ==
          'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: website/.cache-loader/indexnow/state.json
          key:
            indexnow-production-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-

      - name: Prepare changed URLs for IndexNow
        id: indexnow
        if:
          github.repository == 'transloadit/uppy' && github.ref ==
          'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: website
        run: node scripts/indexnow.mjs prepare

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Submit changed URLs to IndexNow
        if:
          steps.indexnow.outcome == 'success' && steps.deployment.outcome ==
          'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: website
        run: node scripts/indexnow.mjs submit

      - name: Save IndexNow production state
        if:
          always() && steps.deployment.outcome == 'success' && github.ref ==
          'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: website/.cache-loader/indexnow/state.json
          key:
            indexnow-production-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive IndexNow production state
        if:
          always() && steps.deployment.outcome == 'success' && github.ref ==
          'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-production-state
          path: website/.cache-loader/indexnow/state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
